name: Publish Fieldlight stream

on:
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing post issue number (leave blank with dry run to check setup only)
        required: false
        type: string
      dry_run:
        description: Validate without publishing posts, comments, or commits
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  issues: write

concurrency:
  group: fieldlight-stream-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'annimch04/public-writing' &&
      github.actor == 'annimch04' &&
      github.triggering_actor == 'annimch04' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.issue.user.login == 'annimch04' &&
        startsWith(github.event.issue.title, '[Post] ') &&
        contains(github.event.issue.body, '### Post') &&
        contains(github.event.issue.body, '### Publication')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REQUESTED_ISSUE: ${{ github.event.issue.number || inputs.issue_number || '' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
    steps:
      - name: Check out trusted canonical source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          path: source

      - name: Read the public website for build validation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: fieldlight-institute/fieldlight.com
          ref: main
          path: site
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install pinned image decoder
        run: python -m pip install --disable-pip-version-check -r source/tools/requirements-stream.txt

      - name: Run publisher safety tests
        run: python -m unittest discover -s source/tests -p 'test_publish_stream.py'

      - name: Prepare current owner-authored posts
        run: python source/tools/stream_workflow.py prepare --report "$RUNNER_TEMP/stream-report.json"

      - name: Build and validate the site and feeds
        run: python site/scripts/build-stream.py --source source --manifest "$RUNNER_TEMP/stream-manifest.json"

      - name: Save canonical posts for the website's next scheduled update
        run: python source/tools/stream_workflow.py publish --report "$RUNNER_TEMP/stream-report.json" --manifest "$RUNNER_TEMP/stream-manifest.json"

      - name: Confirm the public feed before commenting Published
        run: python source/tools/stream_workflow.py finish --report "$RUNNER_TEMP/stream-report.json"

      - name: Report incomplete publication accurately
        if: failure()
        run: |
          if [ -f source/tools/stream_workflow.py ]; then
            python source/tools/stream_workflow.py failure --report "$RUNNER_TEMP/stream-report.json"
          fi

      - name: Record the observed publication state
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report_path = Path(os.environ['RUNNER_TEMP']) / 'stream-report.json'
          if report_path.exists():
              report = json.loads(report_path.read_text())
              state = report['stage']
              count = len(report['posts'])
              text = f'Fieldlight stream state: **{state}**. Posts checked for this publication: {count}.\n'
          else:
              text = 'Fieldlight stream setup did not reach post preparation. Review the first failed step.\n'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(text)
          PY
