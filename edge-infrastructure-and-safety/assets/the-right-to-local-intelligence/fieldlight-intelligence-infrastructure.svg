<svg xmlns="http://www.w3.org/2000/svg" class="desktop-map" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="fieldlight-map-title fieldlight-map-desc">
    <title id="fieldlight-map-title">Fieldlight intelligence infrastructure topology</title>
    <desc id="fieldlight-map-desc">Human authority governs household and mobile nodes. Those nodes connect to a neighborhood intelligence utility, regional anchor, trusted bridge, and external cloud. Authority and memory remain local while scoped delegation moves outward and results with audit records return.</desc>
    <style>
  .field-arc { fill: none; stroke: #607080; stroke-width: 1.5; opacity: 0.55; }
  .field-arc-accent { fill: none; stroke: #9a78ff; stroke-width: 1.5; opacity: 0.3; }
  .authority-line { fill: none; stroke: #d6a23d; stroke-width: 3; stroke-linecap: round; }
  .delegation-line { fill: none; stroke: #9a78ff; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  .return-line { fill: none; stroke: #63b7a0; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 4 11; }
  .node-shell { fill: #142536; stroke: #607080; stroke-width: 1.5; }
  .desktop-map .node-shell-primary { fill: url(#fieldlight-hub-glow); stroke: #9a78ff; stroke-width: 2; }
  .mobile-map .node-shell-primary { fill: url(#fieldlight-mobile-hub-glow); stroke: #9a78ff; stroke-width: 2; }
  .node-core { fill: #302f59; stroke: #9a78ff; stroke-width: 1.5; }
  .authority-core { fill: #40372c; stroke: #d6a23d; stroke-width: 2; }
  .cloud-core { fill: #243549; stroke: #91a8c4; stroke-width: 1.5; }
  .gate { fill: none; stroke: #d6a23d; stroke-width: 3; }
  .gate-soft { fill: none; stroke: #d6a23d; stroke-width: 10; opacity: 0.1; }
  .label {
    fill: #fff9ed;
    font: 500 16.8px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    letter-spacing: -0.02em;
  }
  .label-large {
    fill: #fff9ed;
    font: 400 21.6px Georgia, "Times New Roman", serif;
    letter-spacing: -0.03em;
  }
  .hub-label { font-size: 27.2px; }
  .eyebrow {
    fill: #b9b5ad;
    font: 500 10.2px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    letter-spacing: 0.17em;
  }
  .hub-eyebrow { fill: #fff9ed; opacity: 0.82; }
  .caption {
    fill: #b9b5ad;
    font: 400 11.5px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .micro {
    fill: #b9b5ad;
    font: 500 9.3px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    letter-spacing: 0.12em;
  }
  .accent-copy { fill: #d6a23d; }
  .bridge-copy { fill: #9a78ff; }
  .icon {
    fill: none;
    stroke: #fff9ed;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .institution-icon {
    fill: none;
    stroke: #fff9ed;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .federation-link { fill: none; stroke: #9a78ff; stroke-width: 2; opacity: 0.72; }
  .legend-line { stroke-width: 3; stroke-linecap: round; }
  .mobile-map .label { font-size: 26.4px; }
  .mobile-map .label-large { font-size: 28.8px; }
  .mobile-map .hub-label { font-size: 32.8px; }
  .mobile-map .eyebrow,
  .mobile-map .caption,
  .mobile-map .micro { font-size: 19.2px; }
</style>
    <defs>
      <radialGradient id="fieldlight-hub-glow" cx="50%" cy="42%" r="64%">
        <stop offset="0%" stop-color="#9a78ff" stop-opacity="0.28"></stop>
        <stop offset="58%" stop-color="#142536" stop-opacity="0.94"></stop>
        <stop offset="100%" stop-color="#142536" stop-opacity="0.76"></stop>
      </radialGradient>
      <filter id="fieldlight-soft-glow" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="14"></feGaussianBlur>
      </filter>
      <marker id="fieldlight-arrow-out" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#9a78ff"></path>
      </marker>
      <marker id="fieldlight-arrow-return" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#63b7a0"></path>
      </marker>
    </defs>
    <rect width="100%" height="100%" fill="#0e1c29"></rect>

