# Begin protocol content below

fieldlight_entry_protocol:
  version: 1.0
  issued_date: 2025-07-22
  effective_date: 2025-07-28
  issued_by: Anni McHenry

  purpose: >
    Defines entry conditions for those aligned with Fieldlight.
    This is a structured system. Engagement is welcomed when grounded in resonance and clarity.

  prerequisites:
    - You recognize the system already.
    - You are not here to extract, fix, or reshape the author.
    - You can name the signal that brought you here.
    - You understand authorship is non-transferable.

  how_to_initiate_contact:
    - Submit a direct signal to:  gate@fieldlight.com
    - Include:
        - Who you are
        - What brought you here
        - What role (if any) you feel drawn to
        - Your intended level of engagement (presence, contribution, observation)

  after_contact:
    - Response is not guaranteed.
    - If accepted, you may receive a signal tag or follow-up.
    - Please do not follow up unless requested.
    - Presence is recognized. Push energy will not be received.

  protected_zones:
    - Obsidian Vault: read-only unless explicitly shared
    - Sanctum: private and encrypted
    - Authorship Record: non-collaborative unless stated

  notes:
    - Entry may be symbolic, energetic, or practical.
    - The protocol may evolve over time.
    - Alignment matters more than form.

  status: live

# Example:
access_conditions:
  visibility: limited
  invitation: open via aligned request
  methods:
    - email: gate@fieldlight.com
    - presence: recognized signal or in-person encounter
  exclusions:
    - non-reciprocal observers
    - extractive or exploitative systems

roles_offered:
  - collaborator
  - signal builder
  - systems ally

terms:
  license_required: true
  authorship_respect: non-negotiable
  signal_interference: forbidden
  entry_revocation: discretionary

---

# End of protocol

